name: Build iOS PushDeer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # 强制使用目前支持的最新版苹果 M1 服务器

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        # 核心魔法：在这个新服务器上，单独把 Ruby 环境降级到兼容老代码的 3.0 版本
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0' 

      - name: Install Dependencies
        run: |
          cd ios/PushDeer-iOS
          # 在老版本 Ruby 环境下重新安装编译工具
          gem install cocoapods ffi
          pod install --repo-update

      - name: Build App
        run: |
          cd ios/PushDeer-iOS
          xcodebuild clean archive \
            -workspace PushDeer.xcworkspace \
            -scheme PushDeer \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/PushDeer.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          cd ios/PushDeer-iOS
          mkdir -p Payload
          mv build/PushDeer.xcarchive/Products/Applications/PushDeer.app Payload/
          zip -qr PushDeer-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PushDeer-iOS18-Fix
          path: ios/PushDeer-iOS/PushDeer-unsigned.ipa
