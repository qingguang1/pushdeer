name: Build iOS PushDeer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          cd ios/PushDeer-iOS
          # 关键补丁：让服务器先下载所有的第三方代码包
          pod install

      - name: Build App
        run: |
          cd ios/PushDeer-iOS
          xcodebuild clean archive \
            -workspace PushDeer.xcworkspace \
            -scheme PushDeer \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/PushDeer.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          cd ios/PushDeer-iOS
          mkdir -p Payload
          mv build/PushDeer.xcarchive/Products/Applications/PushDeer.app Payload/
          zip -qr PushDeer-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PushDeer-iOS18-Fix
          path: ios/PushDeer-iOS/PushDeer-unsigned.ipa
