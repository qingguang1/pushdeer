name: Build iOS PushDeer

on:
  workflow_dispatch:

jobs:
  build:
    # 核心修改：降级到 macOS 13 服务器，完美适配老项目的编译环境
    runs-on: macos-13

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          cd ios/PushDeer-iOS
          # 核心修改：强制更新依赖库索引并安装，专治老项目水土不服
          pod install --repo-update

      - name: Build App
        run: |
          cd ios/PushDeer-iOS
          xcodebuild clean archive \
            -workspace PushDeer.xcworkspace \
            -scheme PushDeer \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/PushDeer.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          cd ios/PushDeer-iOS
          mkdir -p Payload
          mv build/PushDeer.xcarchive/Products/Applications/PushDeer.app Payload/
          zip -qr PushDeer-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PushDeer-iOS18-Fix
          path: ios/PushDeer-iOS/PushDeer-unsigned.ipa
