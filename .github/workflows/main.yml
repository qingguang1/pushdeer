name: Build iOS PushDeer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build App
        run: |
          # 修复了路径：进入正确的工程所在目录
          cd ios/PushDeer-iOS
          xcodebuild clean archive \
            -workspace PushDeer.xcworkspace \
            -scheme PushDeer \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/PushDeer.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          # 修复了路径：在正确的目录下打包
          cd ios/PushDeer-iOS
          mkdir -p Payload
          mv build/PushDeer.xcarchive/Products/Applications/PushDeer.app Payload/
          zip -qr PushDeer-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PushDeer-iOS18-Fix
          # 修复了路径：从正确的位置提取打包好的文件
          path: ios/PushDeer-iOS/PushDeer-unsigned.ipa
